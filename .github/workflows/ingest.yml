name: Ingest patches.tar.gz

on:
  push:
    branches: [main]
    paths:
      - "patches.tar.gz"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    outputs:
      new_sha: ${{ steps.commit.outputs.sha }}
      prepared: ${{ steps.commit.outputs.prepared }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract patches.tar.gz into ./patches
        id: extract
        run: |
          # The push trigger fires on removal too (this job's own cleanup
          # commit deletes patches.tar.gz) -- no file here just means
          # "nothing to ingest", not a failure.
          if [ ! -f patches.tar.gz ]; then
            echo "no patches.tar.gz in repo root -- nothing to do"
            echo "extracted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rm -rf patches
          mkdir patches
          tar -xzf patches.tar.gz -C patches
          echo "extracted=true" >> "$GITHUB_OUTPUT"

      - name: Build workspace/, then discard patches/ and the archive
        id: commit
        if: steps.extract.outputs.extracted == 'true'
        run: |
          bash scripts/prepare-workspace.sh
          # Neither is committed: workspace/ is the only thing that
          # persists -- patches/ was never added to git, and this removes
          # patches.tar.gz too, so nothing but the prepared sources is
          # left in the repo once this run is done.
          rm -rf patches patches.tar.gz

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A .
          if git diff --cached --quiet; then
            echo "nothing to commit"
            echo "prepared=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Apply patches.tar.gz -> workspace/ [skip ci]"
            git push
            echo "prepared=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: ingest
    if: needs.ingest.outputs.prepared == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.ingest.outputs.new_sha }}
    secrets: inherit
    permissions:
      contents: write
