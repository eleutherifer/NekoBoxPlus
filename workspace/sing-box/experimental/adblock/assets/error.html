<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{.TitleHumanReadable}}</title>

  <style>
    :root {
      color-scheme: light dark;

      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --text: #17202a;
      --muted: #5f6b7a;
      --border: #d9dee5;
      --accent: #ff3838;
      --accent-bg: #fff0f0;
      --code-bg: #f0f2f5;
      --code-text: #3f4a57;
      --shadow: 0 0 8px rgba(20, 30, 40, 0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141415;
        --card-bg: #1e1e1e;
        --text: #e8edf2;
        --muted: #a5b0bd;
        --border: #2b3440;
        --accent: #ec2c2c;
        --accent-bg: #2a1719;
        --code-bg: #10151b;
        --code-text: #c4ccd5;
        --shadow: 0 0 8px rgba(0, 0, 0, 0.45);
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(circle at top, rgba(214, 69, 69, 0.10), transparent 34rem),
        var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 2rem;
      line-height: 1.5;
    }

    .page {
      width: 100%;
      max-width: 760px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: clamp(1.5rem, 4vw, 3rem);
    }

    .header {
      display: flex;
      gap: 1rem;
      align-items: flex-start;
      margin-bottom: 1.25rem;
    }

    .icon {
      flex: 0 0 auto;
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: var(--accent-bg);
      color: var(--accent);
      display: grid;
      place-items: center;
    }

    .icon svg {
      width: 32px;
      height: 32px;
      display: block;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 0 0 0.25rem;
    }

    h1 {
      font-size: clamp(1.85rem, 5vw, 2.75rem);
      line-height: 1.08;
      margin: 0;
      letter-spacing: -0.04em;
    }

    .description {
      color: var(--muted);
      font-size: 1.05rem;
      margin: 1rem 0 0;
    }

    .details {
      margin-top: 1.75rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
    }

    .details-grid {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 0.55rem 1rem;
      font-size: 0.95rem;
    }

    .details-grid dt {
      color: var(--muted);
    }

    .details-grid dd {
      margin: 0;
      min-width: 0;
      overflow-wrap: anywhere;
      color: var(--code-text);
    }

    code {
        background: var(--code-bg);
        color: var(--code-text);
        border-radius: 7px;
        padding: 0.08rem 0.3rem;
        font-family:
            ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
            "Liberation Mono", "Courier New", monospace;
        font-size: 0.88em;
        line-height: 1.55;
    }

    .details-grid dd code {
        box-decoration-break: clone;
        -webkit-box-decoration-break: clone;
    }

    .actions {
      margin-top: 1.75rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .button {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      border-radius: 8px;
      padding: 0.7rem 1rem;
      font: inherit;
      font-weight: 650;
      text-decoration: none;
      cursor: pointer;
    }

    .button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .footer {
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
      margin-top: 1rem;
    }

    @media (max-width: 520px) {
      body {
        padding: 1rem;
      }

      .header {
        flex-direction: column;
      }

      .details-grid {
        grid-template-columns: 1fr;
      }

      .details-grid dt {
        margin-top: 0.4rem;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="card" role="alert" aria-labelledby="error-title">
      <div class="header">
        <div class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" role="img">
            <path
              d="M12 3.25 21.25 19a1.5 1.5 0 0 1-1.3 2.25H4.05A1.5 1.5 0 0 1 2.75 19L12 3.25Z"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linejoin="round"
            />
            <path
              d="M12 8.25v5.25"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
            <path
              d="M12 17.25h.01"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
            />
          </svg>
        </div>

        <div>
          <p class="eyebrow">{{.Heading}}</p>
          <h1 id="error-title">{{.TitleHumanReadable}}</h1>
          <p class="description">
            {{.Description}}
          </p>
        </div>
      </div>

      <div class="details" aria-label="Error details">
        <dl class="details-grid">
          <dt>Error</dt>
          <dd><code>{{.RawError}}</code></dd>

          <dt>URL</dt>
          <dd><code>{{.URL}}</code></dd>

          <dt>Timestamp</dt>
          <dd><code>{{.Timestamp}}</code></dd>
        </dl>
      </div>

      <div class="actions">
        <button class="button primary" onclick="location.reload()">Try again</button>
        <button class="button" onclick="history.back()">Go back</button>
      </div>
    </section>

    <p class="footer">
      This message was generated by {{.Generator}}
    </p>
  </main>
</body>
</html>
